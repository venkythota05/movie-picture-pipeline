name: Frontend CD

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate frontend API URL
        env:
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          if [ "$REACT_APP_MOVIE_API_URL" != "http://a69fe45e4b411452081d152246e2033d-41587109.us-east-1.elb.amazonaws.com" ]; then
            echo "ERROR: REACT_APP_MOVIE_API_URL is not the expected backend LoadBalancer URL."
            exit 1
          fi

          echo "Frontend API URL validation passed."

      - name: Build Docker image
        env:
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            -t "$ECR_FRONTEND_REPO:${{ github.sha }}" .

      - name: Verify frontend build contains backend URL
        env:
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          docker run --rm \
            -e REACT_APP_MOVIE_API_URL="$REACT_APP_MOVIE_API_URL" \
            "$ECR_FRONTEND_REPO:${{ github.sha }}" \
            sh -c 'grep -R "$REACT_APP_MOVIE_API_URL" /app/build/static/js'

          echo "Frontend build contains the correct backend API URL."

      - name: Tag Docker image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          docker tag \
            "$ECR_FRONTEND_REPO:${{ github.sha }}" \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:${{ github.sha }}"

      - name: Push Docker image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          docker push \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws sts get-caller-identity

          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

          kubectl get nodes

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s

      - name: List Kubernetes deployments
        run: kubectl get deployments

      - name: Update frontend image in Kubernetes
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:${{ github.sha }}"

          echo "Setting frontend image to:"
          echo "$IMAGE"

          kubectl set image deployment/frontend \
            frontend="$IMAGE"

      - name: Verify image before rollout
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          EXPECTED_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:${{ github.sha }}"
          ACTUAL_IMAGE="$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected image:"
          echo "$EXPECTED_IMAGE"

          echo "Actual image:"
          echo "$ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Kubernetes deployment is using the wrong image."
            exit 1
          fi

          echo "Frontend image is correct."

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=5m

      - name: Verify image after rollout
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          EXPECTED_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:${{ github.sha }}"
          ACTUAL_IMAGE="$(kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Image after rollout:"
          echo "$ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Frontend image changed after rollout."
            exit 1
          fi

          echo "Frontend deployment verified successfully."

      - name: Verify frontend pod
        run: |
          kubectl get pods -l app=frontend -o wide